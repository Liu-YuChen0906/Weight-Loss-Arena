name: Java and Vue verification
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: '24.11.0' }
      - uses: pnpm/action-setup@v4
        with: { version: '11.25.0' }
      - name: Install formatting tools
        run: pnpm install --frozen-lockfile
      - name: Check code formatting
        run: pnpm run format:check
      - run: apps/java-api/mvnw -B -f apps/java-api/pom.xml verify
      - name: Require real integration execution
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          p = pathlib.Path('apps/java-api/target/surefire-reports/TEST-team.shangcheng.ApiIntegrationTest.xml')
          root = ET.parse(p).getroot()
          assert int(root.get('tests',0)) >= 2 and int(root.get('skipped',0)) == 0
          PY
      - run: pnpm --dir apps/web-vue install --frozen-lockfile
      - run: pnpm --dir apps/web-vue run test
      - run: pnpm --dir apps/web-vue run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            apps/java-api/target/surefire-reports
            apps/web-vue/dist
