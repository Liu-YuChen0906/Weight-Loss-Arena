server {
    listen 80;
    server_name 101.132.150.197;
    location /.well-known/acme-challenge/ { root /var/lib/payathon-acme; }
    location / { return 308 https://101.132.150.197$request_uri; }
}
server {
    listen 443 ssl;
    server_name 101.132.150.197;
    ssl_certificate /etc/letsencrypt/live/101.132.150.197/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/101.132.150.197/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    access_log /var/log/nginx/payathon-test.access.log;
    error_log /var/log/nginx/payathon-test.error.log warn;
    location / {
        proxy_pass http://127.0.0.1:4181;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
    }
}
