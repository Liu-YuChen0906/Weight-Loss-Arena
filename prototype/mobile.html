<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>上秤 · 移动端预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3f5;color:#191919;font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.toolbar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;padding:16px;background:#fff;border-bottom:1px solid #e3e3e3}.toolbar strong{margin-right:12px}.toolbar button,.toolbar select{font:inherit;border:1px solid #e3e3e3;background:#fff;padding:9px 12px;border-radius:8px;min-height:44px;color:#191919;cursor:pointer}.toolbar button.active{background:#fff0ec;color:#cf4938;border-color:#e6ad9f}.hint{text-align:center;font-size:12px;color:#737373;padding:12px 20px;margin:0}.stage{display:flex;justify-content:center;padding:0 12px 24px}iframe{display:block;width:390px;max-width:100%;height:844px;border:0;background:#fff;box-shadow:0 8px 32px #19191910}.size{text-align:center;color:#737373;font-size:12px;margin:0 0 14px}@media(max-width:480px){.stage{padding:0}iframe{width:100%!important;height:calc(100svh - 178px)}.hint{padding:8px 16px}.toolbar{gap:6px;padding:10px}.toolbar strong{width:100%;text-align:center;margin:0}.size{display:none}}
</style></head><body><div class="toolbar"><strong>上秤 · 移动端预览</strong><button onclick="resizePreview(375,this)">375</button><button class="active" onclick="resizePreview(390,this)">390</button><button onclick="resizePreview(430,this)">430</button><select aria-label="预览页面" onchange="showPage(this.value)"><option value="create">创建小组</option><option value="home">首页</option><option value="join">加入小组</option><option value="lobby">组队大厅</option><option value="group">进行中小组</option><option value="record">体重记录</option><option value="me">数据</option></select></div><p class="hint">这是独立预览工具，下面为实际网页。手机上请直接打开首页体验。</p><p class="size" id="size">390 × 844 · CSS 像素</p><div class="stage"><iframe id="preview" title="上秤移动端页面" src="index.html?preview=create"></iframe></div><script>
function resizePreview(w,b){document.querySelector('iframe').style.width=w+'px';document.querySelectorAll('.toolbar button').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#size').textContent=w+' × 844 · CSS 像素';let f=document.querySelector('iframe').contentWindow;f.render()}
function showPage(page){document.querySelector('iframe').contentWindow.previewScreen(page)}
</script></body></html>
